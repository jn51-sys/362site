<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About — Fast Fantasy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Fast Fantasy home">Fast Fantasy</a>

      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="top.html">Top Performers</a></li>
          <li><a href="teams.html">My Teams</a></li>
          <li><a href="league.html">My Leagues</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-form">
      <form id="loginForm">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br>

        <input type="submit" value="Submit">
      </form>

      <p id="loginMessage" style="color:red;"></p>
    </div>

    <div class="login-image">
      <img src="images/wr1.png" alt="Football player">
    </div>
  </div>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-grid">
      <div class="footer-brand">
        <strong></strong>
        <p class="small">© 2026 Fast Fantasy</p>
      </div>
    </div>
  </footer>

  <script>
    const validUsers = [
      { username: "admin", password: "admin123" },
      { username: "player1", password: "fantasy1" },
      { username: "coach", password: "team2026" }
    ];

    const form = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const match = validUsers.some(
        user => user.username === username && user.password === password
      );

      if (match) {
        message.style.color = "green";
        message.textContent = "Login successful!";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        // window.location.href = "dashboard.html";
      } else {
        message.style.color = "red";
        message.textContent = "Invalid username or password.";
      }
    });
  </script>
</body>
</html>
